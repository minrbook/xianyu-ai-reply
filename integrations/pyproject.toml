[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-ai-tools"
version = "0.1.0"
description = "CLI and stdio MCP tools for a self-hosted Xianyu AI Reply server"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
xianyu = "xianyu_tools.cli:main"
xianyu-mcp = "xianyu_tools.mcp_server:main"

[tool.setuptools.packages.find]
include = ["xianyu_tools*"]
